[package]
name = "esf-server"
version = "0.1.0"
description = "Servidor 24/7 do ESF News Monitor: ingestão + Gemini + API + push APNs"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "cookies", "http2"] }
scraper = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dotenvy = "0.15"
anyhow = "1"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
# JWT ES256 para autenticação token-based no APNs (chave .p8 da Apple)
jsonwebtoken = "9"

[profile.release]
opt-level = 3
lto = true
