[package]
name = "esf-news-monitor"
version = "0.1.0"
description = "Monitor local de notícias financeiras com predição de impacto no S&P 500 Futuro (ES)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "esf_news_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# HTTP (scraping + Gemini + cotações)
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "cookies"] }

# Parsing de HTML (scraping)
scraper = "0.20"

# Persistência local
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilitários
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dotenvy = "0.15"
anyhow = "1"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

# ---- DESKTOP (Windows/macOS/Linux) ----
# Auto-update e subprocesso (conector logado do Truth Social) são exclusivos de
# desktop: no iOS/Android as atualizações vêm pela loja e não há spawn de
# processos. Usamos os cfgs REAIS de target_os (o Cargo não enxerga o cfg
# custom "desktop" do Tauri na resolução de dependências).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
# Chamado DIRETO (não via tauri-plugin-notification): esse plugin descarta o
# handle da notificação no desktop, então o clique nunca chegava ao app (ver
# fire_native_alert em engine.rs). notify-rust nos dá o handle real, com
# detecção de clique testada nas 4 plataformas (Windows/macOS/Linux/BSD).
notify-rust = "4"

# ---- MOBILE (iOS/Android) ----
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
