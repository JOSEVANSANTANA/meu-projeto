[package]
name = "esf-news-monitor"
version = "0.1.0"
description = "Monitor local de notícias financeiras com predição de impacto no S&P 500 Futuro (ES)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "esf_news_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

# Runtime assíncrono + HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "cookies"] }

# Parsing de HTML (scraping)
scraper = "0.20"

# Persistência local
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilitários
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dotenvy = "0.15"
anyhow = "1"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
